<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Task Manager</p>
        <h1>Plan, move, finish.</h1>
      </div>
      <form class="task-form" id="task-form">
        <input id="title" name="title" type="text" placeholder="Task title" required />
        <input id="description" name="description" type="text" placeholder="Description" required />
        <select id="status" name="status" aria-label="Status">
          <option value="todo">Todo</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
        </select>
        <select id="priority" name="priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <input id="dueDate" name="dueDate" type="date" required />
        <button type="submit">Add Task</button>
      </form>
    </header>

    <main class="app-shell">
      <section class="toolbar" aria-label="Task controls">
        <label>
          Status
          <select id="filter-status">
            <option value="">All</option>
            <option value="todo">Todo</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label>
          Priority
          <select id="filter-priority">
            <option value="">All</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>
          Sort
          <select id="sort-by">
            <option value="">Created</option>
            <option value="dueDate">Due date</option>
            <option value="priority">Priority</option>
          </select>
        </label>
        <button id="sort-direction" type="button" data-direction="asc">Asc</button>
      </section>

      <section class="kanban" id="kanban" aria-live="polite"></section>
      <p class="status-message" id="status-message" role="status"></p>
    </main>
  </body>
</html>
